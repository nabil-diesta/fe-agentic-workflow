<div class="shell">
  <aside class="sidebar">
    <!-- Brand -->
    <div class="sidebar-brand">
      <div class="brand-avatar">N</div>
      <div class="brand-info">
        <span class="brand-name">Niesta</span>
        <span class="brand-sub">AI Agent Control</span>
      </div>
    </div>

    <!-- Status -->
    <div class="sidebar-status" [class.online]="connection.listenerOnline()" [class.offline]="!connection.listenerOnline()">
      <span class="status-indicator"></span>
      <div class="status-info">
        <span class="status-label">{{ connection.listenerOnline() ? 'Agent Online' : 'Agent Offline' }}</span>
        <span class="status-sub">{{ connection.listenerOnline() ? 'Listener connected' : 'Listener unreachable' }}</span>
      </div>
    </div>

    <!-- Nav -->
    <nav class="sidebar-nav">
      <a routerLink="/sprint" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-icon">📋</span>
        <span>Sprint Board</span>
      </a>
      <a routerLink="/active" routerLinkActive="active">
        <span class="nav-icon">⚡</span>
        <span>Active Tasks</span>
      </a>
      <a routerLink="/chat" routerLinkActive="active">
        <span class="nav-icon">💬</span>
        <span>Chat</span>
      </a>
      <a routerLink="/sessions" routerLinkActive="active">
        <span class="nav-icon">🖥️</span>
        <span>Codex Sessions</span>
      </a>
      <a routerLink="/settings" routerLinkActive="active">
        <span class="nav-icon">⚙️</span>
        <span>Settings</span>
      </a>
    </nav>

    <!-- Footer -->
    <div class="sidebar-footer">
      <button type="button" class="theme-toggle" (click)="theme.toggle()" [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light' : 'Switch to dark'">
        <span>{{ theme.theme() === 'dark' ? '☀️' : '🌙' }}</span>
        <span>{{ theme.theme() === 'dark' ? 'Light mode' : 'Dark mode' }}</span>
      </button>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>

  @if (toast.message()) {
    <div class="toast" role="status">{{ toast.message() }}</div>
  }
</div>
